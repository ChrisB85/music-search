name: Music Search
version: "0.5.0"
slug: music_search
description: Fuzzy search over the Music Assistant library for voice commands
url: https://github.com/ChrisB85/music-search
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8098
panel_icon: mdi:music-note
panel_title: Zapisy fonetyczne
map:
  - addon_config:rw
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Search API (not needed by Home Assistant, only for access from outside)
options:
  min_score: 75
  refresh_hours: 6
  users: []
  stt_entity: stt.google_cloud
  stt_language: pl-PL
schema:
  min_score: int(0,100)
  refresh_hours: float
  users:
    - person: str
      ma_user: str
  stt_entity: str
  stt_language: str
